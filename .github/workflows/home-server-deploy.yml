name: Home Server Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/my-english-vocab/api

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Home Server
    needs: build

    runs-on:
      - self-hosted
      - home-server

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Update deployment checkout
        run: |
          cd /home/hyungyu/services/myenglishvocab-api
          git fetch origin main
          git checkout --detach "${GITHUB_SHA}"

      - name: Pull application image
        run: |
          cd /home/hyungyu/services/myenglishvocab-api
          APP_IMAGE="${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            docker compose \
            --env-file .env.production \
            -f docker-compose.home.yml \
            pull app

      - name: Deploy application
        run: |
          cd /home/hyungyu/services/myenglishvocab-api
          APP_IMAGE="${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            docker compose \
            --env-file .env.production \
            -f docker-compose.home.yml \
            up -d --no-build app

      - name: Wait for application health
        run: |
          for i in {1..30}; do
            if curl -fsS https://api.myenglishvocab.com/actuator/health > /dev/null; then
              echo "Application is healthy"
              exit 0
            fi

            echo "Waiting for application health... ($i/30)"
            sleep 5
          done

          echo "Application health check failed"
          exit 1

      - name: Show deployment status
        run: |
          cd /home/hyungyu/services/myenglishvocab-api
          APP_IMAGE="${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            docker compose \
            --env-file .env.production \
            -f docker-compose.home.yml \
            ps