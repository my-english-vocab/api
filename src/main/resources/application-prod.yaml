spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  web:
    error:
      include-message: never

  h2:
    console:
      enabled: false

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

jwt:
  secret: ${JWT_SECRET}

auth:
  cookie:
    secure: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

ai:
  provider: ${AI_PROVIDER:openai}
  gemini:
    enabled: ${GEMINI_ENABLED:true}
