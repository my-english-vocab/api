spring:
  application:
    name: server

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:h2:file:./vocabdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  web:
    error:
      include-message: always

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000      # 30분
  refresh-token-expiration: 604800000   # 7일

auth:
  cookie:
    secure: false

logging:
  level:
    com.myenglishvocab.server: INFO
    org.springframework.security: WARN

ai:
  provider: ${AI_PROVIDER:openai} # openai or gemini
  daily-limit: 10

  timeout:
    connect: 5s
    response: 30s

  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.5-flash
    enabled: ${GEMINI_ENABLED:true}

# 프론트엔드 Origin (Next.js 기본 3000, Vite 기본 5173)
cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
