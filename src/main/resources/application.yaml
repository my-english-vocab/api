spring:
  application:
    name: server

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:h2:file:./vocabdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  web:
    error:
      include-message: always

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000      # 30분
  refresh-token-expiration: 604800000   # 7일

logging:
  level:
    com.myenglishvocab.server: INFO
    org.springframework.security: WARN

ai:
  provider: openai # openai or gemini
  daily-limit: 10
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.5-flash
    enabled: true