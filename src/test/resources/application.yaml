spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  profiles:
    active: test

jwt:
  secret: test-secret-key-must-be-at-least-32-characters-long
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

ai:
  provider: openai
  daily-limit: 10
  openai:
    api-key: test-openai-key
    model: gpt-4o-mini
  gemini:
    api-key:
    model: gemini-2.5-flash
    enabled: false

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173

# 테스트에서는 Redis 기반 저장소 대신 인메모리 구현을 사용하므로,
# Actuator가 실행되지 않은 Redis를 확인해 전체 상태를 DOWN으로 만들지 않게 한다.
management:
  health:
    redis:
      enabled: false
