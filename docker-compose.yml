services:
  redis:
    image: redis:7
    container_name: vocab-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: vocab-postgres
    environment:
      POSTGRES_DB: myenglishvocab
      POSTGRES_USER: vocab_app
      POSTGRES_PASSWORD: local-vocab-password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocab_app -d myenglishvocab"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vocab-server
    env_file:
      - path: .env
        required: false
    environment:
      # 새 클론에서도 실행할 수 있도록 기본은 로컬 PostgreSQL 프로필을 사용한다.
      # 실제 운영 프로필 검증은 COMPOSE_SPRING_PROFILE=prod와 실제 환경 변수로 실행한다.
      SPRING_PROFILES_ACTIVE: ${COMPOSE_SPRING_PROFILE:-postgres}
      JWT_SECRET: ${JWT_SECRET:-local-docker-only-secret-change-before-production-2026}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      DB_URL: jdbc:postgresql://postgres:5432/myenglishvocab
      DB_USERNAME: vocab_app
      DB_PASSWORD: local-vocab-password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
