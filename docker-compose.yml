services:
  redis:
    image: redis:7
    container_name: vocab-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: vocab-postgres
    environment:
      POSTGRES_DB: myenglishvocab
      POSTGRES_USER: vocab_app
      POSTGRES_PASSWORD: local-vocab-password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U vocab_app -d myenglishvocab" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
